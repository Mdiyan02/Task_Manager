services:
  # 1. Backend Go REST API Web Service
  - type: web
    name: task-manager-backend-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # 2. Frontend React SPA Static Site
  - type: web
    name: task-manager-frontend-ui
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://task-manager-backend-api.onrender.com/api/tasks

databases:
  # 3. Managed PostgreSQL Database
  - name: task-manager-db
    databaseName: taskmanager
    plan: free
    region: singapore
